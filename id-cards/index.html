<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My ID Cards</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif; padding: 16px; padding-bottom: 100px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { position: relative; background: #222; border-radius: 14px; overflow: hidden; aspect-ratio: 1.58; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; font-size: 14px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .card .del { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(0,0,0,.75); color: #fff; font-size: 18px; display: none; }
  body.edit .card .del { display: block; }
  .empty { color: #999; text-align: center; margin-top: 60px; line-height: 1.6; }
  #msg { color: #ff8a80; text-align: center; margin: 10px 0; font-size: 14px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #111; border-top: 1px solid #333; }
  .bar button { flex: 1; padding: 14px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 600; background: #2d6cdf; color: #fff; }
  .bar button.sec { background: #333; flex: 0 0 90px; }
  #file { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  #viewer { position: fixed; inset: 0; background: #000; z-index: 10; display: none; align-items: center; justify-content: center; }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer.rot img { transform: rotate(90deg); max-width: 100vh; max-height: 100vw; width: 100vh; height: 100vw; object-fit: contain; }
  #viewer .ctl { position: absolute; top: calc(10px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; font-size: 22px; opacity: .7; z-index: 2; }
  #close { right: 12px; } #rotate { left: 12px; }
</style>
</head>
<body>
<h1>My ID Cards</h1>
<div id="msg" hidden></div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden>No cards yet.<br>Tap “Add card” and pick a photo or screenshot of your ID.</div>

<input id="file" type="file" accept="image/*" multiple>
<div class="bar">
  <button id="addBtn">＋ Add card</button>
  <button class="sec" id="editBtn">Edit</button>
</div>

<div id="viewer">
  <button class="ctl" id="rotate" aria-label="Rotate">⟳</button>
  <button class="ctl" id="close" aria-label="Close">✕</button>
  <img id="big" alt="">
</div>

<script>
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; $('msg').hidden = !t; };

/* ---- storage: IndexedDB, falling back to localStorage ---- */
const Store = (() => {
  let db = null, mode = 'idb';
  const LS = 'idcards_v2';
  const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
  const lsWrite = a => localStorage.setItem(LS, JSON.stringify(a));

  const init = () => new Promise(res => {
    try {
      const r = indexedDB.open('idcards_v2', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('cards', { keyPath: 'id' });
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = r.onblocked = () => { mode = 'ls'; res(); };
    } catch { mode = 'ls'; res(); }
  });
  const run = (m, fn) => new Promise((res, rej) => {
    const t = db.transaction('cards', m), q = fn(t.objectStore('cards'));
    t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error);
  });
  return {
    init,
    async all() { return mode === 'idb' ? (await run('readonly', s => s.getAll())).sort((a, b) => a.id - b.id) : lsRead(); },
    async add(c) { return mode === 'idb' ? run('readwrite', s => s.put(c)) : lsWrite([...lsRead(), c]); },
    async del(id) { return mode === 'idb' ? run('readwrite', s => s.delete(id)) : lsWrite(lsRead().filter(c => c.id !== id)); },
    get mode() { return mode; }
  };
})();

const toDataURL = f => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f);
});

/* ---- render ---- */
async function render() {
  let cards = [];
  try { cards = await Store.all(); } catch (e) { msg('Could not read saved cards: ' + (e && e.message || e)); }
  $('grid').innerHTML = ''; $('empty').hidden = cards.length > 0;
  for (const c of cards) {
    const el = document.createElement('div'); el.className = 'card';
    const img = document.createElement('img'); img.src = c.data; img.alt = '';
    const label = document.createElement('div'); label.className = 'label'; label.textContent = c.name;
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
    el.append(img, label, del);
    el.addEventListener('click', e => { if (e.target !== del) show(c.data); });
    del.addEventListener('click', async e => {
      e.stopPropagation();
      if (confirm('Delete "' + c.name + '"?')) { await Store.del(c.id); render(); }
    });
    $('grid').appendChild(el);
  }
}

/* ---- viewer ---- */
let wake = null;
async function show(src) {
  $('big').src = src; $('viewer').classList.remove('rot'); $('viewer').classList.add('open');
  try { wake = await navigator.wakeLock.request('screen'); } catch {}
}
function hide() {
  $('viewer').classList.remove('open');
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
$('close').onclick = hide;
$('rotate').onclick = () => $('viewer').classList.toggle('rot');

/* ---- add ---- */
$('addBtn').onclick = () => $('file').click();
$('file').addEventListener('change', async e => {
  const files = [...e.target.files]; msg('');
  for (const f of files) {
    try {
      const data = await toDataURL(f);
      await Store.add({ id: Date.now() + Math.random(), name: f.name.replace(/\.[^.]+$/, '') || 'ID card', data });
    } catch (err) {
      msg('Could not save "' + f.name + '": ' + (err && err.message || 'storage full or blocked'));
    }
  }
  e.target.value = ''; render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
});
$('editBtn').onclick = e => {
  document.body.classList.toggle('edit');
  e.target.textContent = document.body.classList.contains('edit') ? 'Done' : 'Edit';
};

Store.init().then(render);
</script>
</body>
</html>
